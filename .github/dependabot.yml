version: 2
updates:
  # npm dependencies - grouped by update type, monthly
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]
      # Major versions stay separate (likely breaking changes)
    ignore:
      # Held back deliberately — bumping these breaks the build/e2e. One bad bump
      # in a group poisons the whole grouped PR, so these are pinned until the
      # blocking prerequisite is resolved. Patch updates within the held line are
      # still allowed.
      #
      # @playwright/test: 1.49+ ships a newer Chromium that times out the
      #   Cucumber e2e-ui steps. Held on the 1.48 line.
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # tiptap-markdown: 0.9+ requires @tiptap/core v3; project is on the tiptap v2 line.
      - dependency-name: "tiptap-markdown"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # @lingui/*: 5.9 breaks the build — <Trans> return type is ReactNode, not a
      #   valid JSX element under the current @types/react. Needs a @types/react
      #   upgrade first. Held on the 5.1 line.
      - dependency-name: "@lingui/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Go modules - monthly, all grouped together
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]
    
  # GitHub Actions - monthly, all grouped together
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns: ["*"]
    
  # Docker base images - monthly
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 1
